name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME}" '
            index($0, "## [" v "]") == 1 {f=1; next}
            /^## \[/ {f=0}
            f
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for ${GITHUB_REF_NAME}"; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
